<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · AlgoStep</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='asg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23asg)'/><text x='16' y='22.5' font-size='15' font-weight='700' fill='white' text-anchor='middle' font-family='Inter,Arial,sans-serif'>AS</text></svg>">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">

<!-- 全站图标库（内联 SVG Sprite 注入） -->
<script src="./js/icons.js"></script>

<main class="auth-shell">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="auth-logo">AS</span>
      <div class="auth-brand-text">
        <div class="auth-brand-name">AlgoStep</div>
        <div class="auth-brand-sub">算法可视化实验室</div>
      </div>
    </div>

    <div class="auth-heading">
      <h1>欢迎回来</h1>
      <p>登录后可保存学习进度与收藏的算法。</p>
    </div>

    <div class="auth-error" id="error-msg"></div>

    <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="btn-login">登录</button>
    </form>

    <div class="auth-footer">
      还没有账号？<a href="./register.html">立即注册</a>
    </div>

    <div class="back-home">
      <a href="./index.html">&larr; 返回首页</a>
    </div>
  </div>
</main>

<script src="./js/site.js" data-base="./" data-auth="off" data-footer="simple"></script>
<script src="./js/auth.js"></script>
<script>
  // 已登录则跳转首页
  if (isLoggedIn()) {
    window.location.href = './index.html';
  }

  async function handleLogin(event) {
    event.preventDefault();

    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('error-msg');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    errEl.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
      const data = await loginAPI(username, password);
      if (data.code === 200 && data.data) {
        setAuth(data.data);
        window.location.href = './index.html';
      } else {
        errEl.textContent = data.msg || '登录失败';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    } catch (err) {
      errEl.textContent = '网络错误，请检查后端服务是否启动';
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = '登录';
    }
  }
</script>
</body>
</html>
