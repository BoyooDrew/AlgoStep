<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · AlgoStep</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='asg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23asg)'/><text x='16' y='22.5' font-size='15' font-weight='700' fill='white' text-anchor='middle' font-family='Inter,Arial,sans-serif'>AS</text></svg>">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">

<!-- 全站图标库（内联 SVG Sprite 注入） -->
<script src="./js/icons.js"></script>

<main class="auth-shell">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="auth-logo">AS</span>
      <div class="auth-brand-text">
        <div class="auth-brand-name">AlgoStep</div>
        <div class="auth-brand-sub">算法可视化实验室</div>
      </div>
    </div>

    <div class="auth-heading">
      <h1>创建新账户</h1>
      <p>CSP 算法可视化 · 注册后即可保存学习进度。</p>
    </div>

    <div class="auth-error" id="error-msg"></div>
    <div class="auth-success" id="success-msg"></div>

    <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="3-20 位字母/数字/下划线" required autocomplete="username" minlength="3" maxlength="20">
        <div class="form-hint">用户名将作为登录标识，注册后不可修改</div>
      </div>

      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="至少 6 位" required autocomplete="new-password" minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">确认密码</label>
        <input type="password" id="confirm-password" name="confirmPassword" placeholder="再次输入密码" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit" id="btn-register">注 册</button>
    </form>

    <div class="auth-footer">
      已有账号？<a id="loginLink" href="./login.html">返回登录</a>
    </div>

    <div class="back-home">
      <a href="./index.html">&larr; 返回首页</a>
    </div>
  </div>
</main>

<script src="./js/site.js" data-base="./" data-auth="off" data-footer="simple"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script>
  function getSafeRedirect() {
    const raw = new URLSearchParams(location.search).get('redirect');
    if (!raw) return './index.html';
    if (!/^(?:\/(?!\/)|\.{1,2}\/)[A-Za-z0-9._\-\/]*\.html(?:#[A-Za-z0-9_-]+)?$/.test(raw)) {
      return './index.html';
    }
    return raw;
  }

  const REDIRECT = getSafeRedirect();
  const LOGIN_URL = './login.html' +
    (REDIRECT !== './index.html' ? '?redirect=' + encodeURIComponent(REDIRECT) : '');
  document.getElementById('loginLink').href = LOGIN_URL;

  if (isLoggedIn()) {
    window.location.href = REDIRECT;
  }

  // 密码确认实时校验
  const pwd = document.getElementById('password');
  const confirmPwd = document.getElementById('confirm-password');
  confirmPwd.addEventListener('input', () => {
    if (confirmPwd.value && pwd.value && confirmPwd.value !== pwd.value) {
      confirmPwd.classList.add('invalid');
    } else {
      confirmPwd.classList.remove('invalid');
    }
  });

  async function handleRegister(event) {
    event.preventDefault();

    const btn = document.getElementById('btn-register');
    const errEl = document.getElementById('error-msg');
    const okEl = document.getElementById('success-msg');
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;

    errEl.classList.remove('show');
    okEl.classList.remove('show');

    if (password !== confirm) {
      errEl.textContent = '两次输入的密码不一致';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
      await registerAPI(username, email, password);
      okEl.textContent = '注册成功！正在跳转到登录页...';
      okEl.classList.add('show');
      btn.textContent = '注册成功';
      setTimeout(() => {
        window.location.href = LOGIN_URL;
      }, 1500);
    } catch (err) {
      errEl.textContent = (err && err.msg) || '网络错误，请检查后端服务是否启动';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = '注 册';
    }
  }
</script>
</body>
</html>
