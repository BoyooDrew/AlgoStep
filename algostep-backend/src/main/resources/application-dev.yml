spring:
  # MySQL 数据库（本地）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/algostep?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # 启动时自动执行建表脚本（MySQL）
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/init.sql

# 前端静态文件路径（相对于 algostep-backend 工作目录的上级目录）
algostep:
  frontend:
    path: "file:../"

