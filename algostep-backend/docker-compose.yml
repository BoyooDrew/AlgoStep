version: '3.8'

services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: algostep-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: algostep123
      MYSQL_DATABASE: algostep
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    networks:
      - algostep-net

  # ========== Redis 7.2 ==========
  redis:
    image: redis:7.2-alpine
    container_name: algostep-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - algostep-net

  # ========== Zookeeper (Kafka 依赖) ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: algostep-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - algostep-net

  # ========== Kafka 3.6 ==========
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: algostep-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - algostep-net

  # ========== Kafka UI (可选，可视化管理) ==========
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: algostep-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8090"
    environment:
      KAFKA_CLUSTERS_0_NAME: algostep
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - algostep-net

volumes:
  mysql-data:
  redis-data:
  kafka-data:

networks:
  algostep-net:
    driver: bridge
